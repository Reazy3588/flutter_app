{% extends "shopadmin/base.html" %} {% block content %}
<div class="form-card">
  <form method="POST" enctype="multipart/form-data">
    {% csrf_token %}

    <div class="form-group">
      <label>Category Name *</label>
      <input
        type="text"
        name="name"
        required
        value="{{ category.name|default:'' }}"
      />
    </div>

    <div class="form-group">
      <label>Image</label>
      <input type="file" name="image" accept="image/*" />
      {% if category.image %}
      <img
        src="{{ category.image.url }}"
        style="margin-top: 12px; width: 120px; border-radius: 8px"
      />
      {% endif %}
    </div>

    <div class="form-group">
      <div class="checkbox-group">
        <input
          type="checkbox"
          name="is_active"
          id="active"
          {%
          if
          category.is_active
          or
          not
          category
          %}checked{%
          endif
          %}
        />
        <label for="active">Active</label>
      </div>
    </div>

    <div style="display: flex; gap: 12px; margin-top: 32px">
      <button type="submit" class="btn btn-primary">💾 Save</button>
      <a href="/shop-admin/categories/" class="btn btn-secondary">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
