<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}Shop Admin{% endblock %}</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: #f7f8fa;
        color: #333;
      }

      .shop-header {
        background: linear-gradient(135deg, #8b5cf6 0%, #6366f1 100%);
        color: white;
        padding: 16px 32px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        box-shadow: 0 4px 20px rgba(139, 92, 246, 0.3);
        position: sticky;
        top: 0;
        z-index: 100;
      }
      .shop-header .logo {
        font-size: 20px;
        font-weight: 800;
      }
      .shop-header .user-info {
        display: flex;
        align-items: center;
        gap: 16px;
      }
      .shop-header .user-info a {
        color: white;
        text-decoration: none;
        padding: 8px 16px;
        background: rgba(255, 255, 255, 0.2);
        border-radius: 8px;
        font-size: 13px;
        font-weight: 600;
      }

      .shop-nav {
        background: white;
        padding: 12px 32px;
        display: flex;
        gap: 8px;
        border-bottom: 1px solid #e5e7eb;
        overflow-x: auto;
      }
      .shop-nav a {
        padding: 8px 16px;
        color: #666;
        text-decoration: none;
        font-size: 14px;
        font-weight: 600;
        border-radius: 8px;
        white-space: nowrap;
      }
      .shop-nav a:hover {
        background: #f3f4f6;
        color: #8b5cf6;
      }
      .shop-nav a.active {
        background: #8b5cf6;
        color: white;
      }

      .shop-content {
        padding: 32px;
        max-width: 1400px;
        margin: 0 auto;
      }

      .welcome-card {
        background: linear-gradient(135deg, #8b5cf6 0%, #6366f1 100%);
        border-radius: 20px;
        padding: 32px;
        color: white;
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 32px;
      }
      .welcome-content h1 {
        font-size: 28px;
        font-weight: 800;
        margin-bottom: 8px;
      }

      .section {
        margin-bottom: 32px;
      }
      .section-title {
        font-size: 20px;
        font-weight: 800;
        margin-bottom: 16px;
      }

      .actions-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 12px;
      }
      .action-btn {
        padding: 16px 20px;
        border-radius: 14px;
        text-decoration: none;
        font-weight: 700;
        font-size: 14px;
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .action-primary {
        background: linear-gradient(135deg, #8b5cf6, #6366f1);
        color: white;
      }
      .action-secondary {
        background: white;
        color: #8b5cf6;
        border: 2px solid #8b5cf6;
      }
      .action-success {
        background: linear-gradient(135deg, #10b981, #059669);
        color: white;
      }
      .action-info {
        background: linear-gradient(135deg, #06b6d4, #3b82f6);
        color: white;
      }

      .modules-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
        gap: 16px;
      }
      .module-card {
        background: white;
        border-radius: 16px;
        padding: 20px;
        box-shadow: 0 2px 12px rgba(0, 0, 0, 0.04);
      }
      .module-header {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 16px;
      }
      .module-header h3 {
        font-size: 16px;
        font-weight: 700;
      }
      .module-actions {
        display: flex;
        gap: 8px;
      }
      .module-btn {
        padding: 8px 16px;
        border-radius: 8px;
        text-decoration: none;
        font-size: 13px;
        font-weight: 600;
      }
      .module-btn-add {
        background: #8b5cf6;
        color: white;
      }
      .module-btn-view {
        background: #f3f4f6;
        color: #333;
      }
    </style>
  </head>
  <body>
    <header class="shop-header">
      <div class="logo">🏪 Shop Admin</div>
      <div class="user-info">
        <span>👤 {{ request.user.full_name|default:request.user.email }}</span>
        <a href="/shop-admin/logout/">Logout</a>
      </div>
    </header>

    <nav class="shop-nav">
      <a href="/shop-admin/" class="active">🏠 Dashboard</a>
      <a href="/shop-admin/api/products/">📦 Products</a>
      <a href="/shop-admin/api/categories/">📂 Categories</a>
      <a href="/shop-admin/api/orders/">🛒 Orders</a>
    </nav>

    <main class="shop-content">{% block content %}{% endblock %}</main>
  </body>
</html>
