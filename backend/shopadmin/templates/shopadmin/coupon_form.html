{% extends "shopadmin/base.html" %} {% block content %}
<div class="form-card">
  <form method="POST">
    {% csrf_token %}

    <div class="form-group">
      <label>Coupon Code *</label>
      <input
        type="text"
        name="code"
        required
        placeholder="e.g. SAVE10"
        style="text-transform: uppercase"
      />
    </div>

    <div class="form-group">
      <label>Discount Amount ($) *</label>
      <input
        type="number"
        name="discount_amount"
        step="0.01"
        required
        value="0"
      />
    </div>

    <div class="form-group">
      <label>Minimum Order Amount ($)</label>
      <input type="number" name="min_order_amount" step="0.01" value="0" />
    </div>

    <div class="form-group">
      <label>Maximum Uses (0 = unlimited)</label>
      <input type="number" name="max_uses" value="0" />
    </div>

    <div class="form-group">
      <label>Valid From *</label>
      <input type="datetime-local" name="valid_from" required />
    </div>

    <div class="form-group">
      <label>Valid To *</label>
      <input type="datetime-local" name="valid_to" required />
    </div>

    <div class="form-group">
      <div class="checkbox-group">
        <input type="checkbox" name="is_active" id="active" checked />
        <label for="active">Active</label>
      </div>
    </div>

    <div style="display: flex; gap: 12px; margin-top: 32px">
      <button type="submit" class="btn btn-primary">💾 Save</button>
      <a href="/shop-admin/coupons/" class="btn btn-secondary">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
