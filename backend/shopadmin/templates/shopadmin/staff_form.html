{% extends "shopadmin/base.html" %} {% block content %}
<div class="page-header">
  <h1>{% if staff %}Edit Staff{% else %}Add Staff{% endif %}</h1>
</div>

<div class="form-card">
  <form method="POST">
    {% csrf_token %}

    <div class="form-group">
      <label>Full Name</label>
      <input
        type="text"
        name="full_name"
        value="{{ staff.full_name|default:'' }}"
        required
      />
    </div>

    <div class="form-group">
      <label>Email</label>
      <input
        type="email"
        name="email"
        value="{{ staff.email|default:'' }}"
        {%
        if
        staff
        %}readonly{%
        else
        %}required{%
        endif
        %}
      />
    </div>

    <div class="form-group">
      <label>Phone Number</label>
      <input
        type="text"
        name="phone_number"
        value="{{ staff.phone_number|default:'' }}"
        required
      />
    </div>

    <div class="form-group">
      <label>Role</label>
      <select name="role" required>
        <option
          value="shop_staff"
          {%
          if
          staff.role=""
          ="shop_staff"
          %}selected{%
          endif
          %}
        >
          Shop Staff
        </option>
        <option
          value="delivery"
          {%
          if
          staff.role=""
          ="delivery"
          %}selected{%
          endif
          %}
        >
          Delivery
        </option>
      </select>
    </div>

    <div class="form-group">
      <label>Password {% if staff %}(ទុកទំនេរបើមិនចង់ប្តូរ){% endif %}</label>
      <input
        type="password"
        name="password"
        {%
        if
        not
        staff
        %}required{%
        endif
        %}
      />
    </div>

    <button type="submit" class="btn btn-primary">💾 Save</button>
    <a href="/shop-admin/staff/" class="btn btn-secondary">Cancel</a>
  </form>
</div>
{% endblock %}
