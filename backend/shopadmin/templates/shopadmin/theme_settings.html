{% extends "shopadmin/base.html" %} {% block content %}
<div class="form-card">
  <form method="POST" enctype="multipart/form-data">
    {% csrf_token %}

    <h3 style="margin-bottom: 20px">🏪 Shop Information</h3>

    <div class="form-group">
      <label>Shop Name</label>
      <input type="text" name="name" value="{{ shop.name }}" required />
    </div>

    <div class="form-group">
      <label>Description</label>
      <textarea name="description">{{ shop.description }}</textarea>
    </div>

    <div class="form-group">
      <label>Phone</label>
      <input type="text" name="phone" value="{{ shop.phone }}" />
    </div>

    <div class="form-group">
      <label>Email</label>
      <input type="email" name="email" value="{{ shop.email }}" />
    </div>

    <div class="form-group">
      <label>Address</label>
      <textarea name="address">{{ shop.address }}</textarea>
    </div>

    <h3 style="margin: 32px 0 20px">🎨 Theme Colors</h3>

    <div class="form-group">
      <label>Primary Color</label>
      <input
        type="text"
        name="primary_color"
        value="{{ shop.primary_color }}"
        placeholder="#1F6FEB"
      />
    </div>

    <div class="form-group">
      <label>Secondary Color</label>
      <input
        type="text"
        name="secondary_color"
        value="{{ shop.secondary_color }}"
        placeholder="#1547A8"
      />
    </div>

    <div class="form-group">
      <label>Accent Color</label>
      <input
        type="text"
        name="accent_color"
        value="{{ shop.accent_color }}"
        placeholder="#00D2FF"
      />
    </div>

    <h3 style="margin: 32px 0 20px">🖼️ Shop Logo</h3>

    <div class="form-group">
      <label>Logo Image</label>
      <input type="file" name="logo" accept="image/*" />

      <!-- ✅ បង្ហាញ Logo បច្ចុប្បន្ន -->
      {% if shop.logo %}
      <div style="margin-top: 16px">
        <p style="font-size: 13px; color: #666; margin-bottom: 8px">
          Current Logo:
        </p>
        <img
          src="{{ shop.logo.url }}"
          style="
            width: 120px;
            height: 120px;
            border-radius: 12px;
            object-fit: cover;
            border: 2px solid #e5e7eb;
          "
        />
        <p style="font-size: 11px; color: #999; margin-top: 8px">
          {{ shop.logo.name }}
        </p>
      </div>
      {% else %}
      <div
        style="
          margin-top: 16px;
          padding: 20px;
          background: #f9fafb;
          border-radius: 12px;
          text-align: center;
        "
      >
        <p style="font-size: 13px; color: #999">No logo uploaded yet</p>
      </div>
      {% endif %}
    </div>

    <div style="display: flex; gap: 12px; margin-top: 32px">
      <button type="submit" class="btn btn-primary">💾 Save Changes</button>
      <a href="/shop-admin/" class="btn btn-secondary">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
